<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - CurrenciesApp</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">💰 CurrenciesApp</a>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Главная</a>
                <a href="/users"><i class="fas fa-users"></i> Пользователи</a>
                <a href="/currencies"><i class="fas fa-chart-line"></i> Валюты</a>
                <a href="/author"><i class="fas fa-user-tie"></i> Об авторе</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>CurrenciesApp v1.0 &copy; 2024</p>
            <p>Курсы валют предоставлены ЦБ РФ</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>

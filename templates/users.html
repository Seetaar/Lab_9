{% extends "base.html" %}

{% block content %}
<div class="header-with-action">
    <h1><i class="fas fa-users"></i> Пользователи</h1>
    <a href="/user?new=true" class="btn btn-primary">
        <i class="fas fa-plus"></i> Добавить пользователя
    </a>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Подписок на валюты</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.subscribed_currencies|length }}</td>
                <td class="actions">
                    <a href="/user?id={{ user.id }}" class="btn btn-sm btn-info">
                        <i class="fas fa-eye"></i> Просмотр
                    </a>
                    <a href="/user?id={{ user.id }}&action=edit" class="btn btn-sm btn-warning">
                        <i class="fas fa-edit"></i> Изменить
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
